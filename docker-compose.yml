services:
  # Production build served by nginx, routed through an existing Traefik instance.
  photo-editor:
    container_name: photo-editor
    build: .
    restart: unless-stopped
    networks:
      - traefik_web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.photo-editor.rule=Host(`editor.enricojoe.site`)"
      - "traefik.http.routers.photo-editor.entrypoints=websecure"
      - "traefik.http.routers.photo-editor.tls=true"
      - "traefik.http.routers.photo-editor.tls.certresolver=myresolver"
      - "traefik.http.services.photo-editor.loadbalancer.server.port=80"
      # Pins which network Traefik uses to reach this container, so routing
      # doesn't break if another network is ever attached alongside this one.
      - "traefik.docker.network=traefik_web"

networks:
  traefik_web:
    external: true
